services:
  jobmanager:
    image: flink:1.20-scala_2.12-java17
    ports:
      - "8092:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./flink-sql-connector-duckdb/target/flink-sql-connector-duckdb-1.0-SNAPSHOT.jar:/opt/flink/lib/flink-sql-connector-duckdb.jar
      - ./data:/data

  taskmanager:
    image: flink:1.20-scala_2.12-java17
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./flink-sql-connector-duckdb/target/flink-sql-connector-duckdb-1.0-SNAPSHOT.jar:/opt/flink/lib/flink-sql-connector-duckdb.jar
      - ./data:/data
